[project]
name = "dbsyncx"
version = "1.2.0"
description = "Database sync tool for developers"
readme = "README.md"
requires-python = ">=3.8"

authors = [
    { name = "Mzwakhe Besho", email = "beshomzwakhe@icloud.com" }
]

license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/ZakesB/dbsyncx"
Repository = "https://github.com/ZakesB/dbsyncx"
"Bug Tracker" = "https://github.com/ZakesB/dbsyncx/issues"

keywords = ["postgres", "database", "sync", "cli", "backup"]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: Developers",
]

dependencies = [
    "typer[all]",
    "pyyaml",
    "pytest",
    "pytest-cov",
]

[project.scripts]
dbsyncx = "dbsyncx.main:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
